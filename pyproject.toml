[project]
name = "ai-health-coop"
version = "0.0.0"
description = "Diabetes risk assessment Streamlit app"
readme = "README.md"
requires-python = ">=3.10"

[tool.ruff]
target-version = "py310"
line-length = 130
src = ["."]
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "W",
    "UP",
    "B",
    "SIM",
]
ignore = [
    # Broad except blocks are intentional for resilient model loading in the UI.
    "BLE001",
]

[tool.ruff.lint.isort]
known-first-party = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
